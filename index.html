function getAnswer(prefix, index) {
  var el = document.querySelector('input[name="' + prefix + index + '"]:checked');
  return el ? parseInt(el.value) : 0;
}

function calcAvg(prefix, len) {
  var sum = 0, count = 0;
  for (var i = 0; i < len; i++) {
    var val = getAnswer(prefix, i);
    if (val > 0) { sum += val; count++; }
  }
  return count > 0 ? sum / count : 0;
}

function calcBigFiveScores() {
  var scores = {};
  for (var dimName in bigFiveDimensions) {
    var dim = bigFiveDimensions[dimName];
    var sum = 0, count = 0;
    for (var i = 0; i < dim.indices.length; i++) {
      var idx = dim.indices[i];
      var val = getAnswer('bf_', idx);
      if (val > 0) {
        if (dim.reverse[i]) { val = 6 - val; }
        sum += val; count++;
      }
    }
    scores[dimName] = count > 0 ? (sum / count / 5) * 100 : 0;
  }
  return scores;
}

function calcSelfVerification() { return calcAvg('sv_', selfVerificationData.length); }

function getAnimalResult(pdpScores) {

  return animals;
}


function drawRadar(scores) {
  var canvas = document.getElementById('radarCanvas');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var cx = W / 2, cy = H / 2, R = Math.min(cx, cy) - 50;
  ctx.clearRect(0, 0, W, H);

  var labels = ['外向性', '随和性', '责任心', '情绪性', '开放性'];
  var keys = ['外向性', '随和性', '责任心', '情绪性', '开放性'];
  var n = 5;

  for (var level = 1; level <= 5; level++) {
    var r = R * level / 5;
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      var x = cx + r * Math.cos(angle);
      var y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = '#e0e0e0';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  for (var i = 0; i < n; i++) {
    var angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    var x = cx + R * Math.cos(angle);
    var y = cy + R * Math.sin(angle);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.strokeStyle = '#ccc';
    ctx.lineWidth = 1;
    ctx.stroke();

    var lx = cx + (R + 30) * Math.cos(angle);
    var ly = cy + (R + 30) * Math.sin(angle);
    ctx.fillStyle = '#555';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(labels[i], lx, ly);
  }

  ctx.beginPath();
  for (var i = 0; i <= n; i++) {
    var idx = i % n;
    var angle = (Math.PI * 2 * idx / n) - Math.PI / 2;
    var val = Math.min(scores[keys[idx]] / 100, 1);
    var r = R * val;
    var x = cx + r * Math.cos(angle);
    var y = cy + r * Math.sin(angle);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(102, 126, 234, 0.25)';
  ctx.fill();
  ctx.strokeStyle = '#667eea';
  ctx.lineWidth = 2.5;
  ctx.stroke();

  for (var i = 0; i < n; i++) {
    var angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    var val = Math.min(scores[keys[i]] / 100, 1);
    var r = R * val;
    var x = cx + r * Math.cos(angle);
    var y = cy + r * Math.sin(angle);
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#667eea';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

  html += '<h3 style="margin:20px 0 12px;color:#333;">PDP动物人格得分</h3>';
  var animalColors = { '老虎型':'#ef4444', '孔雀型':'#f59e0b', '考拉型':'#10b981', '猫头鹰型':'#6366f1', '变色龙型':'#ec4899' };
  for (var i = 0; i < animalRanking.length; i++) {
    var a = animalRanking[i];
    var v = Math.round(a.score / 5 * 100);
    html += '<div class="score-bar-container">';
    html += '<div class="score-bar-label"><span>' + a.name + '</span><span>' + Math.round(a.score * 20) + '/100</span></div>';
    html += '<div class="score-bar"><div class="score-bar-fill" style="width:' + v + '%;background:' + animalColors[a.name] + '"></div></div>';
    html += '</div>';
  }

  html += '<h3 style="margin:20px 0 12px;color:#333;">其他维度得分</h3>';
  html += '<div class="score-bar-container">';
  html += '<div class="score-bar-label"><span>自我验证追求</span><span>' + Math.round(svScore / 5 * 100) + '/100</span></div>';
  html += '<div class="score-bar"><div class="score-bar-fill" style="width:' + Math.round(svScore / 5 * 100) + '%;background:#667eea"></div></div>';
  html += '</div>';
  html += '<div class="score-bar-container">';
  html += '<div class="score-bar-label"><span>促进定向</span><span>' + Math.round(promoScore / 5 * 100) + '/100</span></div>';
  html += '<div class="score-bar"><div class="score-bar-fill" style="width:' + Math.round(promoScore / 5 * 100) + '%;background:#10b981"></div></div>';
  html += '</div>';
  html += '<div class="score-bar-container">';
  html += '<div class="score-bar-label"><span>预防定向</span><span>' + Math.round(preventScore / 5 * 100) + '/100</span></div>';
  html += '<div class="score-bar"><div class="score-bar-fill" style="width:' + Math.round(preventScore / 5 * 100) + '%;background:#f59e0b"></div></div>';
  html += '</div>';

  document.getElementById('scoreBars').innerHTML = html;

  var detailHtml = '<h3 style="margin:20px 0 12px;color:#333;">动物人格详细解读</h3>';
  for (var i = 0; i < animalRanking.length; i++) {
    var a = animalRanking[i];
    var info = animalDescriptions[a.name];
    var rank = i === 0 ? '(主导)' : (i === 1 ? '(辅助)' : '');
    detailHtml += '<div class="animal-detail">';
    detailHtml += '<h3>' + a.name + ' ' + rank + '</h3>';
    detailHtml += '<p>' + info.desc + '</p>';
    detailHtml += '</div>';
  }
  document.getElementById('animalDetails').innerHTML = detailHtml;

  document.getElementById('testForm').style.display = 'none';
  document.getElementById('resultPage').style.display = 'block';
  window.scrollTo(0, 0);
}

function getAnimalEmoji(name) {
  var emojis = { '老虎型':'\u{1F405}', '孔雀型':'\u{1F99A}', '考拉型':'\u{1F43A}', '猫头鹰型':'\u{1F989}', '变色龙型':'\u{1F98E}' };
  return emojis[name] || '';
}


document.getElementById('testForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  var btn = document.getElementById('submitBtn');
  var status = document.getElementById('submitStatus');

  btn.disabled = true;
  btn.textContent = '正在提交...';
  status.textContent = '';

  var allAnswered = true;
  var allPrefixes = [
    { p: 'bf_', len: bigFiveData.length },
    { p: 'sv_', len: selfVerificationData.length },
    { p: 'promo_', len: promotionData.length },
    { p: 'prevent_', len: preventionData.length },
    { p: 'pdp_', len: pdpData.length }
  ];
  for (var k = 0; k < allPrefixes.length; k++) {
    for (var i = 0; i < allPrefixes[k].len; i++) {
      if (!document.querySelector('input[name="' + allPrefixes[k].p + i + '"]:checked')) {
        allAnswered = false; break;
      }
    }
    if (!allAnswered) break;
  }

  if (!allAnswered) {
    btn.disabled = false;
    btn.textContent = '提交结果';
    alert('请回答所有题目后再提交');
    return;
  }

  showResults();

  var fieldMap = {
    'bf_': '大五人格第',
    'sv_': '自我验证第',
    'promo_': '促进定向第',
    'prevent_': '预防定向第',
    'pdp_': 'PDP第'
  };
  var formData = new FormData(this);
  var newFormData = new FormData();
  for (var pair of formData.entries()) {
    var key = pair[0];
    var val = pair[1];
    var matched = false;
    for (var prefix in fieldMap) {
      if (key.indexOf(prefix) === 0) {
        var num = key.replace(prefix, '');
        newFormData.append(fieldMap[prefix] + (parseInt(num) + 1) + '题', val);
        matched = true;
        break;
      }
    }
    if (!matched) {
      newFormData.append(key, val);
    }
  }

  try {
    var res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      body: newFormData
    });
    var data = await res.json();
    if (data.success) {
      status.textContent = '已提交，结果已发送到邮箱。';
    } else {
      status.textContent = '提交失败：' + (data.message || '请检查网络后重试');
    }
  } catch (err) {
    status.textContent = '提交失败，请检查网络或稍后重试。';
  }

  btn.disabled = false;
  btn.textContent = '提交结果';
});
</script>
