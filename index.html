<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性格测试</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .progress-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: rgba(255,255,255,0.3); z-index: 1000;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #f093fb, #f5576c); width: 0%; transition: width 0.3s ease;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header {
            text-align: center; padding: 40px 20px; color: white;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.2); }
        .header p { font-size: 1.1em; opacity: 0.9; }
        .section {
            background: white; border-radius: 15px; padding: 30px; margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); transition: transform 0.3s ease;
        }
        .section:hover { transform: translateY(-2px); }
        .section-title {
            font-size: 1.5em; color: #667eea; margin-bottom: 20px; padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        .question {
            margin-bottom: 20px; padding: 20px; background: #f8f9ff; border-radius: 10px;
            border-left: 4px solid #667eea; transition: all 0.3s ease;
        }
        .question:hover { background: #f0f4ff; border-left-color: #764ba2; }
        .question-text { font-size: 1.1em; margin-bottom: 12px; color: #444; }
        .options { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .option {
            flex: 1; min-width: 80px; text-align: center; padding: 10px 15px;
            background: white; border: 2px solid #e0e0e0; border-radius: 25px;
            cursor: pointer; transition: all 0.3s ease; font-size: 0.95em;
        }
        .option:hover { border-color: #667eea; background: #f8f9ff; }
        .option input[type="radio"] { display: none; }
        .option input[type="radio"]:checked + .option-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border-color: transparent; transform: scale(1.05);
        }
        .option-label {
            display: block; padding: 8px 12px; border-radius: 20px; cursor: pointer;
        }
        .btn {
            display: inline-block; padding: 15px 40px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 30px; font-size: 1.1em;
            cursor: pointer; transition: all 0.3s ease; text-decoration: none;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .results { display: none; }
        .result-card {
            background: white; border-radius: 15px; padding: 30px; margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .animal-display {
            text-align: center; padding: 30px; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px; margin: 20px 0;
        }
        .animal-icon { width: 120px; height: 120px; margin: 0 auto 20px; }
        .animal-name { font-size: 2em; color: #667eea; margin-bottom: 10px; }
        .animal-desc { font-size: 1.1em; line-height: 1.8; color: #555; max-width: 600px; margin: 0 auto; }
        .chart-container { position: relative; height: 400px; margin: 20px 0; }
        .score-bars { margin: 20px 0; }
        .score-bar { margin-bottom: 15px; }
        .score-label { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .bar-bg { background: #f0f0f0; border-radius: 10px; height: 25px; overflow: hidden; }
        .bar-fill {
            height: 100%; border-radius: 10px; transition: width 1s ease;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }
        .pdp-scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin: 20px 0; }
        .pdp-card {
            background: #f8f9ff; padding: 20px; border-radius: 10px; text-align: center;
            border: 2px solid transparent; transition: all 0.3s ease;
        }
        .pdp-card.highlight { border-color: #667eea; background: #f0f4ff; transform: scale(1.05); }
        .pdp-card h4 { color: #667eea; margin-bottom: 10px; }
        .pdp-card .score { font-size: 2em; font-weight: bold; color: #764ba2; }
        .note {
            background: #fff3cd; border: 1px solid #ffeaa7; border-radius: 10px;
            padding: 15px; margin: 20px 0; font-size: 0.95em; color: #856404;
        }
        @media (max-width: 600px) {
            .header h1 { font-size: 2em; }
            .options { flex-direction: column; }
            .option { min-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
    
    <div class="container">
        <div class="header">
            <h1>性格测试</h1>
            <p>本测试用于课堂互动与团队沟通讨论，不等同于正式测评或心理诊断。</p>
        </div>

        <form id="personalityForm" action="https://web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="2f37f6dc-684c-48f5-804b-38ffdb29ce2f">
            <input type="hidden" name="subject" value="性格测试结果">
            <input type="hidden" name="from_name" value="性格测试">
            <input type="hidden" id="formData" name="formData">

            <!-- 大五人格 -->
            <div class="section">
                <h2 class="section-title">大五人格测试</h2>
                <p style="margin-bottom: 20px; color: #666;">请根据其与您的实际情况的相符程度回答问题：1=非常不同意，2=不太同意，3=中立，4=比较同意，5=非常同意</p>
                <div id="bigFiveQuestions"></div>
            </div>

            <!-- 自我验证追求 -->
            <div class="section">
                <h2 class="section-title">自我验证追求</h2>
                <div id="selfVerificationQuestions"></div>
            </div>

            <!-- 调节焦点促进型 -->
            <div class="section">
                <h2 class="section-title">调节焦点-促进型</h2>
                <div id="promotionQuestions"></div>
            </div>

            <!-- 调节焦点预防型 -->
            <div class="section">
                <h2 class="section-title">调节焦点-预防型</h2>
                <div id="preventionQuestions"></div>
            </div>

            <!-- PDP性格测试 -->
            <div class="section">
                <h2 class="section-title">PDP性格测试</h2>
                <div id="pdpQuestions"></div>
            </div>

            <div style="text-align: center; margin: 30px 0;">
                <button type="submit" class="btn">提交并查看结果</button>
            </div>
        </form>

        <!-- 结果展示 -->
        <div class="results" id="results">
            <div class="result-card">
                <h2 class="section-title">测试结果</h2>
                
                <div class="chart-container">
                    <canvas id="bigFiveChart"></canvas>
                </div>

                <div class="score-bars" id="bigFiveScores"></div>

                <h3 style="margin: 30px 0 20px; color: #667eea;">PDP性格类型得分</h3>
                <div class="pdp-scores" id="pdpScores"></div>

                <div class="animal-display" id="animalDisplay"></div>

                <div id="animalDescriptions"></div>
            </div>

            <div style="text-align: center; margin: 30px 0;">
                <button class="btn" onclick="window.print()">打印结果</button>
                <button class="btn" onclick="location.reload()">重新测试</button>
            </div>
        </div>
    </div>

    <script>
        // 大五人格题目数据
        const bigFiveData = [
            { text: "我是一个......的人", sub: "1. 倾向于安静寡言。", reverse: false, dimension: "外倾性" },
            { text: "", sub: "2. 富有同情心，心肠柔软。", reverse: false, dimension: "随和性" },
            { text: "", sub: "3. 倾向于缺乏条理。", reverse: true, dimension: "责任心" },
            { text: "", sub: "4. 经常担心很多事情。", reverse: false, dimension: "情绪性" },
            { text: "", sub: "5. 对艺术、音乐或文学很着迷。", reverse: false, dimension: "开放性" },
            { text: "", sub: "6. 有主导性，会像领导者一样行事。", reverse: false, dimension: "外倾性" },
            { text: "", sub: "7. 有时会对别人粗鲁。", reverse: true, dimension: "随和性" },
            { text: "", sub: "8. 开始做任务时有困难。", reverse: true, dimension: "责任心" },
            { text: "", sub: "9. 容易感到沮丧、低落。", reverse: false, dimension: "情绪性" },
            { text: "", sub: "10. 对抽象概念兴趣不大。", reverse: true, dimension: "开放性" },
            { text: "", sub: "11. 精力充沛。", reverse: false, dimension: "外倾性" },
            { text: "", sub: "12. 倾向于相信别人是善意的。", reverse: false, dimension: "随和性" },
            { text: "", sub: "13. 可靠，总是可以被信赖。", reverse: false, dimension: "责任心" },
            { text: "", sub: "14. 情绪稳定，不容易心烦意乱。", reverse: true, dimension: "情绪性" },
            { text: "", sub: "15. 有原创性，常能提出新想法。", reverse: false, dimension: "开放性" },
            { text: "", sub: "16. 外向、善于社交。", reverse: false, dimension: "外倾性" },
            { text: "", sub: "17. 可能显得冷淡、不关心他人。", reverse: true, dimension: "随和性" },
            { text: "", sub: "18. 保持物品整洁有序。", reverse: false, dimension: "责任心" },
            { text: "", sub: "19. 放松，能很好地应对压力。", reverse: true, dimension: "情绪性" },
            { text: "", sub: "20. 艺术兴趣较少。", reverse: true, dimension: "开放性" },
            { text: "", sub: "21. 更喜欢让别人来负责或带头。", reverse: true, dimension: "外倾性" },
            { text: "", sub: "22. 尊重他人，以尊重的方式对待别人。", reverse: false, dimension: "随和性" },
            { text: "", sub: "23. 有毅力，会坚持到任务完成。", reverse: false, dimension: "责任心" },
            { text: "", sub: "24. 有安全感，对自己感到自在。", reverse: true, dimension: "情绪性" },
            { text: "", sub: "25. 思想复杂，善于深入思考。", reverse: false, dimension: "开放性" },
            { text: "", sub: "26. 比其他人不那么活跃。", reverse: true, dimension: "外倾性" },
            { text: "", sub: "27. 倾向于挑剔别人、指出别人的问题。", reverse: true, dimension: "随和性" },
            { text: "", sub: "28. 可能有些粗心。", reverse: true, dimension: "责任心" },
            { text: "", sub: "29. 脾气易变，容易情绪化。", reverse: false, dimension: "情绪性" },
            { text: "", sub: "30. 创造力较少。", reverse: true, dimension: "开放性" }
        ];

        // 自我验证追求题目
        const selfVerificationData = [
            "我会坦诚地告诉别人我的习惯和性格，这样他们才能了解我。",
            "在结识新朋友时，我会选择坦诚地展现真实的自己，即使这会让我显得不够完美。",
            "在工作时，我会让别人看到真实的自己，即使这意味着会让别人看到我的局限性。",
            "如果参加面试，我会尽量真实表达自己的性格和工作方式。",
            "我喜欢做真实的自己，而不是伪装成别人。",
            "我宁愿别人了解真实的我，也不愿他们对我抱有过高的期望。",
            "为了能和了解我、清楚对我的期望的人一起工作，我愿意接受较低的薪水。",
            "在找工作时，我会努力寻找一个能够接纳真实的我的地方。"
        ];

        // 调节焦点促进型题目
        const promotionData = [
            "我会经常思考，自己如何能获得成功。",
            "我会将精力集中在我希望获得成功的事情上。",
            "我会深入思考，如何能实现自己的愿望和理想。",
            "总的来说，比起避免失败我更加注重如何获得成功。"
        ];

        // 调节焦点预防型题目
        const preventionData = [
            "相对而言，我更关注如何能避免失败。",
            "比起追求更多的收益，我更注重预防损失。",
            "我较少考虑如何追求成功，更关注防止不好的事情发生。",
            "总体而言，预防损失和获取成功，我更在意前者。"
        ];

        // PDP性格测试题目
        const pdpData = [
            "我喜欢快速抓住目标，并推动事情向前。",
            "我喜欢在团队中表达想法、带动气氛。",
            "我重视稳定、和谐、让大家都感到舒服。",
            "做决定前，我希望先看清规则、数据和依据。",
            "我能根据不同对象和场景调整自己的表达方式。",
            "面对困难任务时，我倾向于直接行动、解决问题。",
            "我比较容易主动认识新人或开启话题。",
            "我愿意耐心倾听别人，把关系照顾好。",
            "我会注意细节，尽量避免错误和遗漏。",
            "当计划变化时，我通常能比较快适应。",
            "需要有人做决定时，我愿意站出来承担责任。",
            "公开展示、分享或说服别人会让我更有能量。",
            "我不喜欢太突然、太激烈的变化。",
            "比起凭感觉行动，我更相信分析和证据。",
            "我常能把不同人的意见整合成一个可行方案。"
        ];

        // PDP类型定义
        const pdpTypes = {
            tiger: {
                name: "老虎型",
                subtitle: "目标推进者",
                questions: [1, 6, 11], // 第1,6,11题 (index 0,5,10)
                description: "你是一个目标感很强的人，做事果断、直接，遇到问题时更倾向于快速判断、推动结果。你不太喜欢拖延和模糊不清的安排，通常愿意承担责任，也能在关键时刻做决定。需要注意的是，你的高效率和强推进力有时会让别人感到压力，因此在表达要求时，可以多留意他人的感受和节奏。",
                color: "#FF6B6B"
            },
            peacock: {
                name: "孔雀型",
                subtitle: "表达影响者",
                questions: [2, 7, 12],
                description: "你擅长表达，也容易带动现场气氛。你热情、外向，喜欢与人互动，能够通过语言、情绪和感染力影响他人。你通常适合承担展示、沟通、协调和激励团队的角色。需要注意的是，你有时可能会更关注想法和氛围，而忽略细节、执行和后续落地，因此可以搭配更清晰的计划来增强结果感。",
                color: "#4ECDC4"
            },
            koala: {
                name: "考拉型",
                subtitle: "稳定支持者",
                questions: [3, 8, 13],
                description: "你给人的感觉温和、可靠，重视关系，也愿意在团队中提供稳定支持。你通常耐心、包容，不喜欢激烈冲突，更倾向于用平和的方式维持合作。你的优势在于让别人感到安心和被接纳。需要注意的是，当变化太快或冲突出现时，你可能会选择回避，因此可以尝试更主动地表达自己的真实想法。",
                color: "#45B7D1"
            },
            owl: {
                name: "猫头鹰型",
                subtitle: "精确分析者",
                questions: [4, 9, 14],
                description: "你做事谨慎，重视证据、逻辑和规则。你通常不会轻易下结论，而是希望先把信息看清楚、把风险想明白。你适合处理需要分析、判断、检查和精确执行的任务。需要注意的是，你有时可能因为追求周全而行动较慢，甚至陷入过度分析；在信息足够时，适当推进会让你的判断更有现实价值。",
                color: "#96CEB4"
            },
            chameleon: {
                name: "变色龙型",
                subtitle: "弹性整合者",
                questions: [5, 10, 15],
                description: "你适应性强，能够根据不同情境调整自己的沟通方式和行动策略。你擅长理解不同人的立场，也能在分歧中寻找平衡点，帮助团队整合意见。你的优势在于灵活、协调和连接。需要注意的是，你有时可能为了适应环境而弱化自己的立场，因此在关键问题上，可以更清楚地表达边界和原则。",
                color: "#DDA0DD"
            }
        };

        // 生成大五人格题目HTML
        function renderBigFiveQuestions() {
            const container = document.getElementById('bigFiveQuestions');
            let html = '';
            bigFiveData.forEach((q, index) => {
                html += `
                    <div class="question">
                        <div class="question-text">${q.sub}</div>
                        <div class="options">
                            ${[1,2,3,4,5].map(val => `
                                <label class="option">
                                    <input type="radio" name="bf_${index}" value="${val}" onchange="updateProgress()">
                                    <span class="option-label">${val}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 生成通用题目HTML
        function renderQuestions(containerId, questions, prefix) {
            const container = document.getElementById(containerId);
            let html = '';
            questions.forEach((q, index) => {
                html += `
                    <div class="question">
                        <div class="question-text">${index + 1}. ${q}</div>
                        <div class="options">
                            ${[1,2,3,4,5].map(val => `
                                <label class="option">
                                    <input type="radio" name="${prefix}_${index}" value="${val}" onchange="updateProgress()">
                                    <span class="option-label">${val}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 更新进度条
        function updateProgress() {
            const totalQuestions = bigFiveData.length + selfVerificationData.length + 
                                  promotionData.length + preventionData.length + pdpData.length;
            let answered = 0;
            
            for (let i = 0; i < bigFiveData.length; i++) {
                if (document.querySelector(`input[name="bf_${i}"]:checked`)) answered++;
            }
            for (let i = 0; i < selfVerificationData.length; i++) {
                if (document.querySelector(`input[name="sv_${i}"]:checked`)) answered++;
            }
            for (let i = 0; i < promotionData.length; i++) {
                if (document.querySelector(`input[name="promo_${i}"]:checked`)) answered++;
            }
            for (let i = 0; i < preventionData.length; i++) {
                if (document.querySelector(`input[name="prevent_${i}"]:checked`)) answered++;
            }
            for (let i = 0; i < pdpData.length; i++) {
                if (document.querySelector(`input[name="pdp_${i}"]:checked`)) answered++;
            }
            
            const progress = (answered / totalQuestions) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        // 反向计分函数
        function reverseScore(value, isReverse) {
            if (isReverse) {
                return 6 - value; // 1->5, 2->4, 3->3, 4->2, 5->1
            }
            return value;
        }

        // 计算结果
        function calculateResults() {
            // 大五人格评分
            const dimensions = { 外倾性: [], 随和性: [], 责任心: [], 情绪性: [], 开放性: [] };
            
            bigFiveData.forEach((q, index) => {
                const selected = document.querySelector(`input[name="bf_${index}"]:checked`);
                if (selected) {
                    const score = reverseScore(parseInt(selected.value), q.reverse);
                    dimensions[q.dimension].push(score);
                }
            });

            const dimAverages = {};
            for (const dim in dimensions) {
                const scores = dimensions[dim];
                dimAverages[dim] = scores.length > 0 ? scores.reduce((a,b) => a+b, 0) / scores.length : 0;
            }

            // 自我验证追求评分
            const svScores = [];
            for (let i = 0; i < selfVerificationData.length; i++) {
                const selected = document.querySelector(`input[name="sv_${i}"]:checked`);
                if (selected) svScores.push(parseInt(selected.value));
            }
            const svTotal = svScores.length > 0 ? svScores.reduce((a,b) => a+b, 0) : 0;

            // 调节焦点评分
            const promoScores = [];
            for (let i = 0; i < promotionData.length; i++) {
                const selected = document.querySelector(`input[name="promo_${i}"]:checked`);
                if (selected) promoScores.push(parseInt(selected.value));
            }
            const promoTotal = promoScores.length > 0 ? promoScores.reduce((a,b) => a+b, 0) : 0;

            const preventScores = [];
            for (let i = 0; i < preventionData.length; i++) {
                const selected = document.querySelector(`input[name="prevent_${i}"]:checked`);
                if (selected) preventScores.push(parseInt(selected.value));
            }
            const preventTotal = preventScores.length > 0 ? preventScores.reduce((a,b) => a+b, 0) : 0;

            // PDP评分
            const pdpScores = {};
            for (const type in pdpTypes) {
                const scores = [];
                pdpTypes[type].questions.forEach(qIndex => {
                    const selected = document.querySelector(`input[name="pdp_${qIndex-1}"]:checked`);
                    if (selected) scores.push(parseInt(selected.value));
                });
                pdpScores[type] = scores.length > 0 ? scores.reduce((a,b) => a+b, 0) : 0;
            }

            return {
                bigFive: dimAverages,
                selfVerification: svTotal,
                promotion: promoTotal,
                prevention: preventTotal,
                pdp: pdpScores
            };
        }

        // 生成动物SVG图标

        // 显示结果
        function showResults(results) {
            document.getElementById('personalityForm').style.display = 'none';
            document.getElementById('results').style.display = 'block';

            // 大五人格雷达图
            const ctx = document.getElementById('bigFiveChart').getContext('2d');
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['外倾性', '随和性', '责任心', '情绪性', '开放性'],
                    datasets: [{
                        label: '大五人格得分',
                        data: [
                            results.bigFive.外倾性 || 0,
                            results.bigFive.随和性 || 0,
                            results.bigFive.责任心 || 0,
                            results.bigFive.情绪性 || 0,
                            results.bigFive.开放性 || 0
                        ],
                        backgroundColor: 'rgba(102, 126, 234, 0.2)',
                        borderColor: '#667eea',
                        borderWidth: 2,
                        pointBackgroundColor: '#667eea',
                        pointBorderColor: '#fff',
                        pointBorderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 5,
                            ticks: { stepSize: 1 }
                        }
                    }
                }
            });

            // 大五人格进度条
            const scoresContainer = document.getElementById('bigFiveScores');
            const dimNames = ['外倾性', '随和性', '责任心', '情绪性', '开放性'];
            let scoresHtml = '';
            dimNames.forEach(dim => {
                const score = results.bigFive[dim] || 0;
                scoresHtml += `
                    <div class="score-bar">
                        <div class="score-label">
                            <span>${dim}</span>
                            <span>${score.toFixed(1)}</span>
                        </div>
                        <div class="bar-bg">
                            <div class="bar-fill" style="width: ${(score/5)*100}%"></div>
                        </div>
                    </div>
                `;
            });
            scoresContainer.innerHTML = scoresHtml;

            // PDP得分卡片
            const pdpContainer = document.getElementById('pdpScores');
            const maxScore = Math.max(...Object.values(results.pdp));
            let pdpHtml = '';
            for (const type in pdpTypes) {
                const isHighlight = results.pdp[type] === maxScore;
                pdpHtml += `
                    <div class="pdp-card ${isHighlight ? 'highlight' : ''}">
                        <div class="animal-icon">${getAnimalSVG(type, 60)}</div>
                        <h4>${pdpTypes[type].name}</h4>
                        <div class="score">${results.pdp[type]}</div>
                    </div>
                `;
            }
            pdpContainer.innerHTML = pdpHtml;

            // 主导类型展示
            const dominantType = Object.keys(results.pdp).reduce((a, b) => 
                results.pdp[a] > results.pdp[b] ? a : b
            );
            const animalDisplay = document.getElementById('animalDisplay');
            animalDisplay.innerHTML = `
                <div class="animal-icon">${getAnimalSVG(dominantType, 120)}</div>
                <div class="animal-name">${pdpTypes[dominantType].name}</div>
                <div class="animal-name" style="font-size: 1.2em; color: #764ba2;">${pdpTypes[dominantType].subtitle}</div>
                <div class="animal-desc">${pdpTypes[dominantType].description}</div>
            `;

            // 所有类型描述
            const descContainer = document.getElementById('animalDescriptions');
            let descHtml = '<h3 style="margin: 30px 0 20px; color: #667eea;">五种性格类型详解</h3>';
            for (const type in pdpTypes) {
                descHtml += `
                    <div class="section" style="margin: 15px 0;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <div style="flex-shrink: 0;">${getAnimalSVG(type, 50)}</div>
                            <div>
                                <h4 style="color: ${pdpTypes[type].color}; margin-bottom: 8px;">
                                    ${pdpTypes[type].name} | ${pdpTypes[type].subtitle}
                                </h4>
                                <p style="line-height: 1.6; color: #555;">${pdpTypes[type].description}</p>
                            </div>
                        </div>
                    </div>
                `;
            }
            descContainer.innerHTML = descHtml;

            // 保存表单数据
            document.getElementById('formData').value = JSON.stringify(results);
        }

        // 页面加载时渲染题目
        document.addEventListener('DOMContentLoaded', function() {
            renderBigFiveQuestions();
            renderQuestions('selfVerificationQuestions', selfVerificationData, 'sv');
            renderQuestions('promotionQuestions', promotionData, 'promo');
            renderQuestions('preventionQuestions', preventionData, 'prevent');
            renderQuestions('pdpQuestions', pdpData, 'pdp');
        });

        // 表单提交处理
        document.getElementById('personalityForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // 验证所有题目已回答
            const allAnswered = [];
            for (let i = 0; i < bigFiveData.length; i++) {
                allAnswered.push(!!document.querySelector(`input[name="bf_${i}"]:checked`));
            }
            for (let i = 0; i < selfVerificationData.length; i++) {
                allAnswered.push(!!document.querySelector(`input[name="sv_${i}"]:checked`));
            }
            for (let i = 0; i < promotionData.length; i++) {
                allAnswered.push(!!document.querySelector(`input[name="promo_${i}"]:checked`));
            }
            for (let i = 0; i < preventionData.length; i++) {
                allAnswered.push(!!document.querySelector(`input[name="prevent_${i}"]:checked`));
            }
            for (let i = 0; i < pdpData.length; i++) {
                allAnswered.push(!!document.querySelector(`input[name="pdp_${i}"]:checked`));
            }
            
            if (allAnswered.includes(false)) {
                alert('请回答所有题目后再提交');
                return;
            }

            // 计算并显示结果
            const results = calculateResults();
            showResults(results);

            // 异步发送到Web3Forms
            const formData = new FormData();
            formData.append('access_key', '2f37f6dc-684c-48f5-804b-38ffdb29ce2f');
            formData.append('subject', '性格测试结果');
            formData.append('from_name', '性格测试');
            formData.append('formData', JSON.stringify(results));
            
            fetch('https://web3forms.com/submit', {
                method: 'POST',
                body: formData
            }).catch(error => console.log('Web3Forms发送失败:', error));
        });
    </script>
</body>
