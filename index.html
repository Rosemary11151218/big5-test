<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大五人格简版测评（BFI-10）</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }
        body {
            background-color: #f4f7fa;
            padding: 30px 15px;
        }
        .container {
            max-width:820px;
            margin: 0 auto;
        }
        .card {
            background: #ffffff;
            border-radius:18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.07);
            padding:36px;
            margin-bottom:24px;
        }
        h1 {
            text-align:center;
            color:#2c3e50;
            font-size:28px;
            margin-bottom:12px;
        }
        .desc {
            text-align:center;
            color:#555;
            margin-bottom:32px;
            line-height:1.6;
        }
        .progress-wrap{
            margin-bottom:28px;
        }
        .progress-text{
            display:flex;
            justify-content:space-between;
            color:#666;
            font-size:14px;
            margin-bottom:6px;
        }
        .progress-bar{
            width:100%;
            height:8px;
            background:#e9ecef;
            border-radius:99px;
            overflow:hidden;
        }
        .progress-inner{
            height:100%;
            width:0%;
            background:#407bff;
            transition: 0.3s ease;
        }
        .question-item{
            padding:20px;
            border:1px solid #edf1f7;
            border-radius:12px;
            margin-bottom:16px;
        }
        .q-title{
            font-size:16px;
            color:#2d3748;
            margin-bottom:14px;
            line-height:1.6;
        }
        .radio-group{
            display:flex;
            flex-wrap:wrap;
            gap:10px;
        }
        .radio-option{
            flex:1;
            min-width:90px;
        }
        .radio-option label{
            display:block;
            text-align:center;
            padding:8px 4px;
            border:1px solid #cbd5e0;
            border-radius:8px;
            cursor:pointer;
            transition:0.2s;
            font-size:14px;
        }
        .radio-option input:checked + label{
            background:#407bff;
            color:white;
            border-color:#407bff;
        }
        .radio-option input{
            display:none;
        }
        .submit-btn{
            width:100%;
            padding:14px;
            border:none;
            background:#407bff;
            color:white;
            font-size:18px;
            border-radius:12px;
            cursor:pointer;
            transition:0.2s;
            margin-top:12px;
        }
        .submit-btn:hover{
            background:#2b62d9;
        }
        .result-box{
            display:none;
        }
        .chart-wrap{
            max-width:520px;
            margin:20px auto 30px;
        }
        .dimension-text{
            margin-top:20px;
            line-height:1.8;
            color:#333;
        }
        .alert-empty{
            color:#e53e3e;
            margin-top:12px;
            text-align:center;
            display:none;
        }
    </style>
</head>
<body>
<div class="container">
    <!--问卷区域-->
    <div id="surveyBox" class="card">
        <h1>大五人格测评（BFI-10 简版量表）</h1>
        <p class="desc">请根据您自身真实情况选择符合程度，1=非常不同意，5=非常同意<br>完成后提交，将立即生成您的人格测评结果</p>
        <div class="progress-wrap">
            <div class="progress-text">
                <span>作答进度</span>
                <span id="progressNum">0/10</span>
            </div>
            <div class="progress-bar">
                <div id="progressBar" class="progress-inner"></div>
            </div>
        </div>
        <form id="big5Form">
            <input type="hidden" name="access_key" value="2f37f6dc-684c-48f5-804b-38ffdb29ce2f">
            <input type="hidden" name="subject" value="新的大五人格测评答卷">

            <div class="question-item">
                <div class="q-title">Q1. 我是一个外向、热情的人</div>
                <div class="radio-group">
                    <div class="radio-option"><input type="radio" id="q1-1" name="Q1" value="1" required><label for="q1-1">1非常不同意</label></div>
                    <div class="radio-option"><input type="radio" id="q1-2" name="Q1" value="2"><label for="q1-2">2不太同意</label></div>
                    <div class="radio-option"><input type="radio" id="q1-3" name="Q1" value="3"><label for="q1-3">3中立</label></div>
                    <div class="radio-option"><input type="radio" id="q1-4" name="Q1" value="4"><label for="q1-4">4比较同意</label></div>
                    <div class="radio-option"><input type="radio" id="q1-5" name="Q1" value="5"><label for="q1-5">5非常同意</label></div>
                </div>
            </div>
            <div class="question-item">
                <div class="q-title">Q2. 我倾向于挑剔、和人争辩</div>
                <div class="radio-group">
                    <div class="radio-option"><input type="radio" id="q2-1" name="Q2" value="1" required><label for="q2-1">1非常不同意</label></div>
                    <div class="radio-option"><input type="radio" id="q2-2" name="Q2" value="2"><label for="q2-2">2不太同意</label></div>
                    <div class="radio-option"><input type="radio" id="q2-3" name="Q2" value="3"><label for="q2-3">3中立</label></div>
                    <div class="radio-option"><input type="radio" id="q2-4" name="Q2" value="4"><label for="q2-4">4比较同意</label></div>
                    <div class="radio-option"><input type="radio" id="q2-5" name="Q2" value="5"><label for="q2-5">5非常同意</label></div>
                </div>
            </div>
            <div class="question-item">
                <div class="q-title">Q3. 我是一个可靠自律的人</div>
                <div class="radio-group">
                    <div class="radio-option"><input type="radio" id="q3-1" name="Q3" value="1" required><label for="q3-1">1非常不同意</label></div>
                    <div class="radio-option"><input type="radio" id="q3-2" name="Q3" value="2"><label for="q3-2">2不太同意</label></div>
                    <div class="radio-option"><input type="radio" id="q3-3" name="Q3" value="3"><label for="q3-3">3中立</label></div>
                    <div class="radio-option"><input type="radio" id="q3-4" name="Q3" value="4"><label for="q3-4">4比较同意</label></div>
                    <div class="radio-option"><input type="radio" id="q3-5" name="Q3" value="5"><label for="q3-5">5非常同意</label></div>
                </div>
            </div>
            <div class="question-item">
                <div class="q-title">Q4. 我容易紧张、情绪不稳定</div>
                <div class="radio-group">
                    <div class="radio-option"><input type="radio" id="q4-1" name="Q4" value="1" required><label for="q4-1">1非常不同意</label></div>
                    <div class="radio-option"><input type="radio" id="q4-2" name="Q4" value="2"><label for="q4-2">2不太同意</label></div>
                    <div class="radio-option"><input type="radio" id="q4-3" name="Q4" value="3"><label for="q4-3">3中立</label></div>
                    <div class="radio-option"><input type="radio" id="q4-4" name="Q4" value="4"><label for="q4-4">4比较同意</label></div>
                    <div class="radio-option"><input type="radio" id="q4-5" name="Q4" value="5"><label for="q4-5">5非常同意</label></div>
                </div>
            </div>
            <div class="question-item">
                <div class="q-title">Q5. 我对新想法充满好奇</div>
                <div class="radio-group">
                    <div class="radio-option"><input type="radio" id="q5-1" name="Q5" value="1" required><label for="q5-1">1非常不同意</label></div>
                    <div class="radio-option"><input type="radio" id="q5-2" name="Q5" value="2"><label for="q5-2">2不太同意</label></div>
                    <div class="radio-option"><input type="radio" id="q5-3" name="Q5" value="3"><label for="q5-3">3中立</label></div>
                    <div class="radio-option"><input type="radio" id="q5-4" name="Q5" value="4"><label for="q5-4">4比较同意</label></div>
                    <div class="radio-option"><input type="radio" id="q5-5" name="Q5" value="5"><label for="q5-5">5非常同意</label></div>
                </div>
            </div>
            <div class="question-item">
                <div class="q-title">Q6. 我偏安静、内向</div>
                <div class="radio-group">
                    <div class="radio-option"><input type="radio" id="q6-1" name="Q6" value="1" required><label for="q6-1">1非常不同意</label></div>
                    <div class="radio-option"><input type="radio" id="q6-2" name="Q6" value="2"><label for="q6-2">2不太同意</label></div>
                    <div class="radio-option"><input type="radio" id="q6-3" name="Q6" value="3"><label for="q6-3">3中立</label></div>
                    <div class="radio-option"><input type="radio" id="q6-4" name="Q6" value="4"><label for="q6-4">4比较同意</label></div>
                    <div class="radio-option"><input type="radio" id="q6-5" name="Q6" value="5"><label for="q6-5">5非常同意</label></div>
                </div>
            </div>
            <div class="question-item">
                <div class="q-title">Q7. 我倾向于体谅、关心他人</div>
                <div class="radio-group">
                    <div class="radio-option"><input type="radio" id="q7-1" name="Q7" value="1" required><label for="q7-1">1非常不同意</label></div>
                    <div class="radio-option"><input type="radio" id="q7-2" name="Q7" value="2"><label for="q7-2">2不太同意</label></div>
                    <div class="radio-option"><input type="radio" id="q7-3" name="Q7" value="3"><label for="q7-3">3中立</label></div>
                    <div class="radio-option"><input type="radio" id="q7-4" name="Q7" value="4"><label for="q7-4">4比较同意</label></div>
                    <div class="radio-option"><input type="radio" id="q7-5" name="Q7" value="5"><label for="q7-5">5非常同意</label></div>
                </div>
            </div>
            <div class="question-item">
                <div class="q-title">Q8. 我做事比较粗心</div>
                <div class="radio-group">
                    <div class="radio-option"><input type="radio" id="q8-1" name="Q8" value="1" required><label for="q8-1">1非常不同意</label></div>
                    <div class="radio-option"><input type="radio" id="q8-2" name="Q8" value="2"><label for="q8-2">2不太同意</label></div>
                    <div class="radio-option"><input type="radio" id="q8-3" name="Q8" value="3"><label for="q8-3">3中立</label></div>
                    <div class="radio-option"><input type="radio" id="q8-4" name="Q8" value="4"><label for="q8-4">4比较同意</label></div>
                    <div class="radio-option"><input type="radio" id="q8-5" name="Q8" value="5"><label for="q8-5">5非常同意</label></div>
                </div>
            </div>
            <div class="question-item">
                <div class="q-title">Q9. 我情绪稳定，不容易心烦</div>
                <div class="radio-group">
                    <div class="radio-option"><input type="radio" id="q9-1" name="Q9" value="1" required><label for="q9-1">1非常不同意</label></div>
                    <div class="radio-option"><input type="radio" id="q9-2" name="Q9" value="2"><label for="q9-2">2不太同意</label></div>
                    <div class="radio-option"><input type="radio" id="q9-3" name="Q9" value="3"><label for="q9-3">3中立</label></div>
                    <div class="radio-option"><input type="radio" id="q9-4" name="Q9" value="4"><label for="q9-4">4比较同意</label></div>
                    <div class="radio-option"><input type="radio" id="q9-5" name="Q9" value="5"><label for="q9-5">5非常同意</label></div>
                </div>
            </div>
            <div class="question-item">
                <div class="q-title">Q10. 我对新事物兴趣有限</div>
                <div class="radio-group">
                    <div class="radio-option"><input type="radio" id="q10-1" name="Q10" value="1" required><label for="q10-1">1非常不同意</label></div>
                    <div class="radio-option"><input type="radio" id="q10-2" name="Q10" value="2"><label for="q10-2">2不太同意</label></div>
                    <div class="radio-option"><input type="radio" id="q10-3" name="Q10" value="3"><label for="q10-3">3中立</label></div>
                    <div class="radio-option"><input type="radio" id="q10-4" name="Q10" value="4"><label for="q10-4">4比较同意</label></div>
                    <div class="radio-option"><input type="radio" id="q10-5" name="Q10" value="5"><label for="q10-5">5非常同意</label></div>
                </div>
            </div>

            <p class="alert-empty" id="alertTip">⚠️请完成所有题目，再提交！</p>
            <button class="submit-btn" type="submit">提交问卷，查看我的人格结果</button>
        </form>
    </div>

    <!--结果卡片-->
    <div id="resultBox" class="card result-box">
        <h1>您的大五人格测评结果</h1>
        <div class="chart-wrap">
            <canvas id="radarChart"></canvas>
        </div>
        <div class="dimension-text" id="resultText"></div>
    </div>
</div>

<script>
    //进度条
    const radios = document.querySelectorAll('input[type="radio"]');
    const progressNum = document.getElementById("progressNum");
    const progressBar = document.getElementById("progressBar");
    const totalQ = 10;
    radios.forEach(radio=>{
        radio.onchange = function(){
            const checkedCount = document.querySelectorAll('input[type="radio"]:checked').length;
            progressNum.innerText = checkedCount + "/" + totalQ;
            progressBar.style.width = (checkedCount/totalQ*100)+"%";
        }
    })

    const form = document.getElementById("big5Form");
    const surveyBox = document.getElementById("surveyBox");
    const resultBox = document.getElementById("resultBox");
    const alertTip = document.getElementById("alertTip");
    let radarChart;

    form.addEventListener("submit", async function(e){
        e.preventDefault(); //阻止原生表单跳转（关键！）
        const allAnswered = document.querySelectorAll('input[type="radio"]:checked').length === 10;
        if(!allAnswered){
            alertTip.style.display="block";
            return;
        }
        alertTip.style.display="none";

        //收集作答
        const formData = new FormData(form);
        const q = {};
        for(let i=1;i<=10;i++){
            q["Q"+i] = Number(document.querySelector(`input[name="Q${i}"]:checked`).value);
        }

        //BFI-10计分（反向计分）
        const E = (6 - q.Q1) + q.Q6;
        const A = q.Q2 + (6 - q.Q7);
        const C = (6 - q.Q3) + q.Q8;
        const N = (6 - q.Q4) + q.Q9;
        const O = q.Q5 + (6 - q.Q10);

        try{
            //异步提交给Web3Forms，不会跳转页面
            await fetch("https://api.web3forms.com/submit",{
                method:"POST",
                body:formData
            })
        }catch(err){
            console.log("提交完成",err);
        }

        //渲染雷达图结果
        surveyBox.style.display="none";
        resultBox.style.display="block";
        drawChart(E,A,C,N,O);
        fillText(E,A,C,N,O);
    })

    function drawChart(E,A,C,N,O){
        const ctx = document.getElementById('radarChart').getContext('2d');
        if(radarChart) radarChart.destroy();
        radarChart = new Chart(ctx, {
            type: 'radar',
            data:{
                labels:["外向性E","宜人性A","尽责性C","神经质N","开放性O"],
                datasets:[{
                    label:"人格得分（2~10分）",
                    data:[E,A,C,N,O],
                    backgroundColor:"rgba(64,123,255,0.2)",
                    borderColor:"#407bff",
                    pointBackgroundColor:"#407bff"
                }]
            },
            options:{
                scales:{
                    r:{min:2,max:10,ticks:{stepSize:2}}
                }
            }
        })
    }

    function fillText(E,A,C,N,O){
        const descList = [
            `✅外向性(E)：${E}分。分数越高，代表越外向、乐于社交；低分偏安静内敛。`,
            `✅宜人性(A)：${A}分。分数越高，代表友善共情、善于体谅他人；低分更直接、喜欢争辩。`,
            `✅尽责性(C)：${C}分。分数越高代表自律有条理、责任心强；低分随性灵活。`,
            `✅神经质(N)：${N}分。分数越高情绪更容易波动敏感；低分情绪稳定平和。`,
            `✅开放性(O)：${O}分。分数越高喜欢探索新事物、想象力强；低分偏好传统保守。`
        ]
        document.getElementById("resultText").innerHTML = descList.join("<br><br>");
    }
</script>
</body>
</html>
